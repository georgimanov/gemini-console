<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Coach Console</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1>AI Coach Console</h1>
      <div class="persona-picker">
        <label for="persona-select">Persona</label>
        <select id="persona-select"></select>
      </div>
    </header>

    <main id="messages" class="messages"></main>

    <form id="composer" class="composer">
      <textarea id="input" placeholder="Type a message…" rows="1" autofocus></textarea>
      <button id="send" type="submit">Send</button>
    </form>
  </div>

  <script src="/app.js"></script>
</body>
</html>
